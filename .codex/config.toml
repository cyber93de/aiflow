# Generated by aiflow from .aiflow/config.json. Edit via: aiflow change-settings.
# Codex CLI reads MCP servers from ~/.codex/config.toml (global) as of most releases -
# this project-local copy may need merging there if your Codex version doesn't pick up
# a repo-level config.toml. ${VAR} values below are aiflow's .env convention (like
# .mcp.json) - verify your Codex CLI version actually expands them from the environment;
# if not, replace with the literal token or check Codex's own env-passthrough option.
[mcp_servers.github]
command = "docker"
args = ["run","-i","--rm","-e","GITHUB_PERSONAL_ACCESS_TOKEN","ghcr.io/github/github-mcp-server"]
[mcp_servers.github.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}"

[mcp_servers.filesystem]
command = "npx"
args = ["-y","@modelcontextprotocol/server-filesystem","C:/dev/aiflow"]

[mcp_servers.graphify]
command = "python"
args = ["-m","graphify.serve","graphify-out/graph.json"]

[mcp_servers.cocoindex-code]
command = "ccc"
args = ["mcp"]

[mcp_servers.context7]
command = "npx"
args = ["-y","@upstash/context7-mcp"]
[mcp_servers.context7.env]
CONTEXT7_API_KEY = "${CONTEXT7_API_KEY}"

