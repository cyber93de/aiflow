name: Release

# After CI succeeds for a push to main: if VERSION is a finished version without
# a matching GitHub Release, build per-OS archives and publish it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0   # need tags to detect existing releases

      - name: Read version
        id: ver
        run: |
          v="$(tr -d ' \t\r\n' < VERSION)"
          [ -n "$v" ] || { echo "VERSION file empty"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"     >> "$GITHUB_OUTPUT"

      - name: Skip if already released, or VERSION is an in-progress snapshot/hotfix
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          tag="${{ steps.ver.outputs.tag }}"
          # main must never carry -SNAPSHOT/-HOTFIX (same rule the pre-push hook enforces).
          if [[ "$v" == *-SNAPSHOT || "$v" == *-HOTFIX ]]; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::VERSION is '$v' (in-progress) — not publishing a release."
          # The release action creates the tag as part of publishing, so checking only for a tag
          # would skip the first release. Check whether the GitHub Release itself already exists.
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::Release $tag already exists — nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build per-OS archives
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          command -v zip >/dev/null 2>&1 || sudo apt-get -y -q install zip
          bash .github/scripts/build-archives.sh

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: aiflow ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/out/aiflow-${{ steps.ver.outputs.version }}-linux.tar.gz
            dist/out/aiflow-${{ steps.ver.outputs.version }}-macos.tar.gz
            dist/out/aiflow-${{ steps.ver.outputs.version }}-windows.zip
            dist/out/aiflow-${{ steps.ver.outputs.version }}-SHA256SUMS.txt
