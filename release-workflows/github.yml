# Created by aiflow — publishes a GitHub Release whenever a version tag is pushed
# (the tag `aiflow release --push` creates). Does not bump versions; that stays a
# local, human-confirmed step (`aiflow release --yes`). Safe to extend with your
# own build/test jobs — this workflow only reacts to tag pushes.
name: publish release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*'   # CalVer YYYY.MM, if versionStrategy=calver

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: "Release ${{ github.ref_name }}. See CHANGELOG.md for details."
