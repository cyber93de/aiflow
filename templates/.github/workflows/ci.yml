name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Agent roster guard: malformed frontmatter silently drops an agent from
      # Claude Code's roster (and a skill/command back to its body text).
      - name: Python (frontmatter guard)
        if: hashFiles('.claude/agents/**/*.md', '.claude/commands/**/*.md', '.claude/skills/**/SKILL.md') != ''
        uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Agent / command / skill frontmatter
        if: hashFiles('.claude/agents/**/*.md', '.claude/commands/**/*.md', '.claude/skills/**/SKILL.md') != ''
        run: |
          python -m pip install --quiet pyyaml
          python .github/scripts/check-frontmatter.py --selftest
          python .github/scripts/check-frontmatter.py \
            .claude/agents .claude/commands .claude/skills

      # `aiflow init` renders .aiflow/*.sh as 100755 and .aiflow/bd-close-sync.sh documents a
      # direct `.aiflow/bd-close-sync.sh <id>` call, so the bit is part of what was shipped.
      # core.filemode=false on Windows drops it from the index without a word, and a colleague
      # on Linux then cannot run the script at all.
      - name: .aiflow/*.sh are executable in the index
        if: hashFiles('.aiflow/*.sh') != ''
        run: |
          set -euo pipefail
          bad="$(git ls-files -s '.aiflow/*.sh' | awk '$1 != "100755"')"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad" | while read -r mode _ _ path; do
              echo "::error file=$path::$path is $mode in the index, expected 100755 - run 'git update-index --chmod=+x $path'"
            done
            exit 1
          fi

      # Auto-detect stack and run style + tests. Extend per project.
      - name: Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Node verify
        if: hashFiles('package.json') != ''
        run: |
          npm ci || npm install
          npx --yes prettier --check . || echo "::warning::prettier issues"
          npm test --if-present

      - name: Python
        if: hashFiles('pyproject.toml','requirements.txt') != ''
        uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Python verify
        if: hashFiles('pyproject.toml','requirements.txt') != ''
        run: |
          pip install black isort pytest || true
          black --check . || echo "::warning::black issues"
          isort --check-only . || echo "::warning::isort issues"
          pytest -q || echo "no tests"

      - name: Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v6
        with: { go-version: "stable" }
      - name: Go verify
        if: hashFiles('go.mod') != ''
        run: |
          test -z "$(gofmt -l .)" || { echo "::error::gofmt"; gofmt -l .; exit 1; }
          go test ./... || echo "no tests"

      - name: Dart/Flutter
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
      - name: Dart verify
        if: hashFiles('pubspec.yaml') != ''
        run: |
          dart format --output=none --set-exit-if-changed . || echo "::warning::dart format"
          flutter analyze || dart analyze || true
          flutter test || dart test || echo "no tests"
